{{- if empty .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keystone-stack.credentialsSecretName" . }}
  labels:
    {{- include "keystone-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  mysql-root-password: {{ include "keystone-stack.secretValue" (list . "mysql-root-password" .Values.credentials.mysqlRootPassword 32) | quote }}
  mysql-password: {{ include "keystone-stack.secretValue" (list . "mysql-password" .Values.credentials.mysqlPassword 32) | quote }}
  jwt-secret: {{ include "keystone-stack.secretValue" (list . "jwt-secret" .Values.credentials.jwtSecret 48) | quote }}
  admin-password: {{ include "keystone-stack.secretValue" (list . "admin-password" .Values.credentials.adminPassword 24) | quote }}
  storage-access-key: {{ .Values.credentials.storageAccessKey | quote }}
  storage-secret-key: {{ .Values.credentials.storageSecretKey | quote }}
  hilbert-access-key: {{ .Values.credentials.hilbertAccessKey | quote }}
  hilbert-secret-key: {{ .Values.credentials.hilbertSecretKey | quote }}
{{- end }}
