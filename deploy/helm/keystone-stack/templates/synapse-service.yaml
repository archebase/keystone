apiVersion: v1
kind: Service
metadata:
  name: {{ include "keystone-stack.componentName" (list . "synapse") }}
  labels:
    {{- include "keystone-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: synapse
  {{- with .Values.synapse.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.synapse.service.type }}
  selector:
    {{- include "keystone-stack.selectorLabels" (list . "synapse") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.synapse.service.port }}
      targetPort: http
      protocol: TCP
