name: Validate staging migration network

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a non-destructive network probe or the one-sample migration"
        required: true
        default: "network_probe"
        type: choice
        options:
          - network_probe
          - migrate_sample
          - migrate_batch
          - prod_download_probe
      tosUrl:
        description: "TOS endpoint to probe from staging"
        required: false
        default: "https://tos-cn-beijing.volces.com"
        type: string
      namespace:
        description: "Existing namespace in the CI staging cluster where the temporary Job will run"
        required: true
        default: "archebase-system"
        type: string
      serviceAccount:
        description: "ServiceAccount used by the temporary Job"
        required: true
        default: "keystone"
        type: string
      sourcePlanId:
        description: "Source dcPlanId for a bounded batch migration; for example, 156 has two records"
        required: false
        default: ""
        type: string
      limit:
        description: "Maximum records from the selected source plan; 0 means all records in that plan"
        required: false
        default: "0"
        type: string
      confirm:
        description: "Type validate-staging-network to create the temporary validation Job"
        required: true
        type: string

permissions:
  contents: read

env:
  JOB_NAME: staging-network-preflight-${{ github.run_id }}

jobs:
  build-migration-image:
    name: Build migration image
    if: github.ref == 'refs/heads/chore/validate-staging-migration-network' && inputs.operation == 'migrate_batch'
    runs-on: archebase-ci-runner
    environment: staging
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      BUILDKIT_NAMESPACE: archebase-system
      BUILDKIT_IMAGE: archebase-cr-cn-beijing.cr.volces.com/upstream/buildkit:buildx-stable-1
      BUILDKIT_PULL_SECRET: keystone-staging-registry
      BUILDKIT_STORAGE: 40Gi
      BUILDKIT_CPU_REQUEST: "2"
      BUILDKIT_MEMORY_REQUEST: 4Gi
      BUILDKIT_CPU_LIMIT: "4"
      BUILDKIT_MEMORY_LIMIT: 8Gi
    steps:
      - uses: actions/checkout@v4
      - name: Configure registry auth
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/docker-config"
          mkdir -p "$docker_config"
          auth="$(printf '%s:%s' "$VOLCENGINE_CR_USERNAME" "$VOLCENGINE_CR_PASSWORD" | base64 | tr -d '\n')"
          printf '{"auths":{"archebase-cr-cn-beijing.cr.volces.com":{"auth":"%s"}}}\n' "$auth" > "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
        shell: bash

      - name: Build and push migration image through staging BuildKit
        id: image
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/staging-kubeconfig"
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > "$path"
          chmod 600 "$path"
          export KUBECONFIG="$path"
          context="$(kubectl config current-context)"
          builder="hilbert-migration-${GITHUB_RUN_ID}"
          resource="${builder}0"
          secret="$BUILDKIT_PULL_SECRET"
          cleanup() {
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            kill "${port_forward_pid:-}" >/dev/null 2>&1 || true
            kubectl --context="$context" -n "$BUILDKIT_NAMESPACE" delete statefulset,service "$resource" --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          kubectl --context="$context" -n "$BUILDKIT_NAMESPACE" create secret docker-registry "$secret" \
            --docker-server=archebase-cr-cn-beijing.cr.volces.com \
            --docker-username="$VOLCENGINE_CR_USERNAME" \
            --docker-password="$VOLCENGINE_CR_PASSWORD" \
            --dry-run=client -o yaml | kubectl --context="$context" apply -f -
          kubectl --context="$context" -n "$BUILDKIT_NAMESPACE" apply -f - <<YAML
          apiVersion: v1
          kind: Service
          metadata:
            name: $resource
            labels:
              app.kubernetes.io/name: buildkit
              archebase.dev/ci-buildkit-resource: $resource
          spec:
            ports:
              - name: buildkit
                port: 1234
                targetPort: 1234
            selector:
              archebase.dev/ci-buildkit-resource: $resource
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: $resource
            labels:
              app.kubernetes.io/name: buildkit
              archebase.dev/ci-buildkit-resource: $resource
          spec:
            serviceName: $resource
            replicas: 1
            selector:
              matchLabels:
                archebase.dev/ci-buildkit-resource: $resource
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: buildkit
                  archebase.dev/ci-buildkit-resource: $resource
              spec:
                serviceAccountName: default
                imagePullSecrets:
                  - name: $secret
                containers:
                  - name: buildkitd
                    image: $BUILDKIT_IMAGE
                    args: ["--addr=tcp://0.0.0.0:1234", "--allow-insecure-entitlement=network.host", "--allow-insecure-entitlement=security.insecure"]
                    ports:
                      - containerPort: 1234
                    readinessProbe:
                      exec:
                        command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    securityContext:
                      privileged: true
          YAML
          kubectl --context="$context" -n "$BUILDKIT_NAMESPACE" rollout status "statefulset/$resource" --timeout=5m
          kubectl --context="$context" -n "$BUILDKIT_NAMESPACE" port-forward "service/$resource" 1234:1234 >/tmp/hilbert-buildkit-port-forward.log 2>&1 &
          port_forward_pid=$!
          for attempt in {1..30}; do
            if docker buildx create --name "$builder" --driver remote tcp://127.0.0.1:1234 --use >/dev/null 2>&1 && docker buildx inspect "$builder" --bootstrap >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              cat /tmp/hilbert-buildkit-port-forward.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          image="archebase-cr-cn-beijing.cr.volces.com/prod/hilbert-migration:${GITHUB_SHA}"
          docker buildx build --builder "$builder" --platform linux/amd64 --file docker/Dockerfile.hilbert-migration --tag "$image" --push .
          echo "image=$image" >> "$GITHUB_OUTPUT"
        shell: bash

  prod-download-probe:
    name: Probe source download from production cluster
    if: github.ref == 'refs/heads/chore/validate-staging-migration-network' && inputs.operation == 'prod_download_probe'
    runs-on: archebase-ci-runner
    environment: production
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Confirm production download probe
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "probe-production-download"
        shell: bash

      - name: Configure production kubeconfig
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/prod-kubeconfig"
          printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$path"
          chmod 600 "$path"
          export KUBECONFIG="$path"
          context="$(kubectl config current-context)"
          kubectl --context="$context" auth can-i create jobs.batch -n archebase-system
          kubectl --context="$context" auth can-i create configmaps -n archebase-system
          kubectl --context="$context" auth can-i create secrets -n archebase-system
          kubectl --context="$context" -n archebase-system get serviceaccount keystone
          echo "KUBECONFIG=$path" >> "$GITHUB_ENV"
          echo "KUBE_CONTEXT=$context" >> "$GITHUB_ENV"
        shell: bash

      - name: Refresh production registry pull secret
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl --context="$KUBE_CONTEXT" -n archebase-system create secret docker-registry keystone-production-registry \\
            --docker-server=archebase-cr-cn-beijing.cr.volces.com \\
            --docker-username="$VOLCENGINE_CR_USERNAME" \\
            --docker-password="$VOLCENGINE_CR_PASSWORD" \\
            --dry-run=client -o yaml | kubectl --context="$KUBE_CONTEXT" apply -f -
        shell: bash

      - name: Create probe credentials Secret
        env:
          SOURCE_HILBERT_USERNAME: liuchao
          SOURCE_HILBERT_PASSWORD: ${{ secrets.SOURCE_HILBERT_PASSWORD }}
        run: |
          set -euo pipefail
          secret="hilbert-prod-download-probe-${GITHUB_RUN_ID}"
          kubectl --context="$KUBE_CONTEXT" -n archebase-system create secret generic "$secret" \\
            --from-literal=username="$SOURCE_HILBERT_USERNAME" \\
            --from-literal=password="$SOURCE_HILBERT_PASSWORD" \\
            --dry-run=client -o yaml | kubectl --context="$KUBE_CONTEXT" apply -f -
          echo "PROBE_SECRET_NAME=$secret" >> "$GITHUB_ENV"
        shell: bash

      - name: Create and run production download probe Job
        run: |
          set -euo pipefail
          job="hilbert-prod-download-probe-${GITHUB_RUN_ID}"
          cat > "${RUNNER_TEMP}/probe.yaml" <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "$job"
            namespace: archebase-system
            labels:
              app.kubernetes.io/name: hilbert-prod-download-probe
              app.kubernetes.io/managed-by: keystone-ci
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 900
            template:
              spec:
                serviceAccountName: keystone
                imagePullSecrets:
                  - name: keystone-production-registry
                restartPolicy: Never
                securityContext:
                  runAsUser: 0
                containers:
                  - name: probe
                    image: archebase-cr-cn-beijing.cr.volces.com/prod/keystone:4f0f0d20b219079b39044bca849b26d2f6aa9aa9
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        apk add --no-cache py3-requests py3-cryptography
                        python3 - <<'PY'
                        import base64, hashlib, json, os, time
                        import requests
                        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
                        base = os.environ["HILBERT_BASE"].rstrip("/")
                        def enc(value, material):
                            raw = base64.b64decode(material)
                            return base64.b64encode(AESGCM(raw[:32]).encrypt(raw[32:], value.encode(), None)).decode()
                        session = requests.Session()
                        started = time.perf_counter()
                        nonce = session.get(base + "/v1/console/nonce/generate", timeout=30).json()["data"]
                        login = session.post(base + "/v1/console/account/login", json={"code": os.environ["HILBERT_USER"], "nonceId": nonce["id"], "cipherDigest": enc(hashlib.sha256(os.environ["HILBERT_PASSWORD"].encode()).hexdigest(), nonce["randomKey"])}, timeout=30).json()
                        if login.get("code") != 0:
                            raise RuntimeError("production Hilbert login failed")
                        session.headers["Authorization"] = "Bearer " + login["data"]["sessionKey"]
                        record = session.get(base + "/v1/data-collection/raw-data/query", params={"workspaceId": "4", "id": "18398", "pageNum": "1", "pageSize": "1"}, timeout=30).json()["data"]["records"][0]
                        url = session.get(base + "/v1/data-collection/raw-data/get-presigned-url", params={"workspaceId": "4", "id": "18398"}, timeout=30).json()["data"]["url"]
                        download_started = time.perf_counter()
                        digest = hashlib.sha256()
                        size = 0
                        with requests.get(url, stream=True, timeout=(30, 600)) as response:
                            response.raise_for_status()
                            for chunk in response.iter_content(8 * 1024 * 1024):
                                if chunk:
                                    digest.update(chunk)
                                    size += len(chunk)
                        seconds = time.perf_counter() - download_started
                        actual = digest.hexdigest()
                        if size != record["bagSize"] or actual != record["bagDigest"].lower():
                            raise RuntimeError("production download identity mismatch")
                        print(json.dumps({"event":"production_download_probe","source_raw_data_id":18398,"bytes":size,"seconds":round(seconds,3),"mbps":round(size/1024/1024/max(seconds,0.001),2),"sha256":actual,"total_seconds":round(time.perf_counter()-started,3)}, ensure_ascii=False), flush=True)
                        PY
                    env:
                      - name: HILBERT_BASE
                        value: "https://hilbert.archebase.cn/hilbert-be-backend"
                      - name: HILBERT_USER
                        valueFrom:
                          secretKeyRef:
                            name: "$PROBE_SECRET_NAME"
                            key: username
                      - name: HILBERT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: "$PROBE_SECRET_NAME"
                            key: password
          YAML
          kubectl --context="$KUBE_CONTEXT" apply -f "${RUNNER_TEMP}/probe.yaml"
          while :; do
            status="$(kubectl --context="$KUBE_CONTEXT" -n archebase-system get job "$job" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}{.status.conditions[?(@.type=="Failed")].status}')"
            case "$status" in
              True) kubectl --context="$KUBE_CONTEXT" -n archebase-system logs "job/$job" --all-containers=true; break ;;
              *True) kubectl --context="$KUBE_CONTEXT" -n archebase-system logs "job/$job" --all-containers=true || true; exit 1 ;;
            esac
            sleep 5
          done
        shell: bash

      - name: Cleanup production probe resources
        if: always()
        run: |
          kubectl --context="$KUBE_CONTEXT" -n archebase-system delete job "hilbert-prod-download-probe-${GITHUB_RUN_ID}" --ignore-not-found=true
          kubectl --context="$KUBE_CONTEXT" -n archebase-system delete secret "$PROBE_SECRET_NAME" --ignore-not-found=true
        shell: bash


  migrate-batch:
    needs: build-migration-image
    name: Migrate one Hilbert plan batch
    if: github.ref == 'refs/heads/chore/validate-staging-migration-network' && inputs.operation == 'migrate_batch'
    runs-on: archebase-ci-runner
    environment: staging
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Confirm batch migration
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "migrate-hilbert-batch"
        shell: bash

      - name: Validate selected source plan
        env:
          SOURCE_PLAN_ID: ${{ inputs.sourcePlanId }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          case "$SOURCE_PLAN_ID" in 96|156|202|248|257|298|303|344|350|357|368|370|371|372|375|378) ;; *) echo "sourcePlanId must be one of the 16 approved source plans" >&2; exit 1 ;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a non-negative integer" >&2; exit 1 ;; esac
        shell: bash

      - name: Configure staging kubeconfig
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/staging-kubeconfig"
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > "$path"
          chmod 600 "$path"
          export KUBECONFIG="$path"
          context="$(kubectl config current-context)"
          kubectl --context="$context" auth can-i create jobs.batch -n archebase-system
          kubectl --context="$context" auth can-i create configmaps -n archebase-system
          kubectl --context="$context" auth can-i create secrets -n archebase-system
          kubectl --context="$context" -n archebase-system get serviceaccount keystone
          echo "KUBECONFIG=$path" >> "$GITHUB_ENV"
          echo "KUBE_CONTEXT=$context" >> "$GITHUB_ENV"
        shell: bash

      - name: Refresh staging registry pull secret
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl --context="$KUBE_CONTEXT" -n archebase-system create secret docker-registry keystone-staging-registry --docker-server=archebase-cr-cn-beijing.cr.volces.com --docker-username="$VOLCENGINE_CR_USERNAME" --docker-password="$VOLCENGINE_CR_PASSWORD" --dry-run=client -o yaml | kubectl --context="$KUBE_CONTEXT" apply -f -
        shell: bash

      - name: Create batch credentials Secret
        env:
          SOURCE_HILBERT_USERNAME: ${{ secrets.SOURCE_HILBERT_USERNAME }}
          SOURCE_HILBERT_PASSWORD: ${{ secrets.SOURCE_HILBERT_PASSWORD }}
          TARGET_HILBERT_USERNAME: ${{ secrets.TARGET_HILBERT_USERNAME }}
          TARGET_HILBERT_PASSWORD: ${{ secrets.TARGET_HILBERT_PASSWORD }}
        run: |
          set -euo pipefail
          secret="hilbert-batch-migration-credentials-${GITHUB_RUN_ID}"
          kubectl --context="$KUBE_CONTEXT" -n archebase-system create secret generic "$secret" --from-literal=source-username="$SOURCE_HILBERT_USERNAME" --from-literal=source-password="$SOURCE_HILBERT_PASSWORD" --from-literal=target-username="$TARGET_HILBERT_USERNAME" --from-literal=target-password="$TARGET_HILBERT_PASSWORD" --dry-run=client -o yaml | kubectl --context="$KUBE_CONTEXT" apply -f -
          echo "MIGRATION_SECRET_NAME=$secret" >> "$GITHUB_ENV"
        shell: bash

      - name: Create batch manifest ConfigMap
        env:
          SOURCE_PLAN_ID: ${{ inputs.sourcePlanId }}
        run: |
          set -euo pipefail
          manifest="hilbert-batch-migration-${GITHUB_RUN_ID}"
          jq --arg plan "$SOURCE_PLAN_ID" '[.[] | select((.source_plan_id|tostring) == $plan)]' .github/migration/manifest.json > "${RUNNER_TEMP}/batch-manifest.json"
          if [ "${{ inputs.limit }}" != "0" ]; then jq --argjson limit "${{ inputs.limit }}" '.[0:$limit]' "${RUNNER_TEMP}/batch-manifest.json" > "${RUNNER_TEMP}/limited-manifest.json"; mv "${RUNNER_TEMP}/limited-manifest.json" "${RUNNER_TEMP}/batch-manifest.json"; fi
          count="$(jq length "${RUNNER_TEMP}/batch-manifest.json")"
          test "$count" -gt 0
          kubectl --context="$KUBE_CONTEXT" -n archebase-system create configmap "$manifest" --from-file=manifest.json="${RUNNER_TEMP}/batch-manifest.json" --from-file=migrate-hilbert-batch.py=.github/scripts/migrate-hilbert-batch.py --dry-run=client -o yaml | kubectl --context="$KUBE_CONTEXT" apply -f -
          echo "MIGRATION_CONFIGMAP_NAME=$manifest" >> "$GITHUB_ENV"
          echo "BATCH_COUNT=$count" >> "$GITHUB_ENV"
        shell: bash

      - name: Create and wait for batch Job
        run: |
          set -euo pipefail
          job="hilbert-batch-migration-${GITHUB_RUN_ID}"
          cat > "${RUNNER_TEMP}/batch.yaml" <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "$job"
            namespace: archebase-system
            labels:
              app.kubernetes.io/name: hilbert-batch-migration
              app.kubernetes.io/managed-by: keystone-ci
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 10800
            template:
              spec:
                serviceAccountName: keystone
                imagePullSecrets:
                  - name: keystone-staging-registry
                restartPolicy: Never
                securityContext:
                  runAsUser: 0
                containers:
                  - name: migrate
                    image: "${{ needs.build-migration-image.outputs.image }}"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        python3 /opt/migration/migrate-hilbert-batch.py --manifest /opt/migration/manifest.json --limit 0
                    env:
                      - name: SOURCE_HILBERT_BASE_URL
                        value: "https://hilbert.archebase.cn/hilbert-be-backend"
                      - name: TARGET_HILBERT_BASE_URL
                        value: "http://hilbert-be-backend:8080/hilbert-be-backend"
                      - name: SOURCE_HILBERT_USERNAME
                        valueFrom:
                          secretKeyRef:
                            name: "$MIGRATION_SECRET_NAME"
                            key: source-username
                      - name: SOURCE_HILBERT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: "$MIGRATION_SECRET_NAME"
                            key: source-password
                      - name: TARGET_HILBERT_USERNAME
                        valueFrom:
                          secretKeyRef:
                            name: "$MIGRATION_SECRET_NAME"
                            key: target-username
                      - name: TARGET_HILBERT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: "$MIGRATION_SECRET_NAME"
                            key: target-password
                    volumeMounts:
                      - name: migration
                        mountPath: /opt/migration
                        readOnly: true
                volumes:
                  - name: migration
                    configMap:
                      name: "$MIGRATION_CONFIGMAP_NAME"
          YAML
          kubectl --context="$KUBE_CONTEXT" apply -f "${RUNNER_TEMP}/batch.yaml"
          deadline=$(( $(date +%s) + 10800 ))
          while :; do
            status="$(kubectl --context="$KUBE_CONTEXT" -n archebase-system get job "$job" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}{.status.conditions[?(@.type=="Failed")].status}')"
            case "$status" in
              True) kubectl --context="$KUBE_CONTEXT" -n archebase-system logs "job/$job" --all-containers=true; break ;;
              *True) kubectl --context="$KUBE_CONTEXT" -n archebase-system logs "job/$job" --all-containers=true || true; exit 1 ;;
            esac
            pod_status="$(kubectl --context="$KUBE_CONTEXT" -n archebase-system get pods -l job-name="$job" -o jsonpath='{range .items[*]}{.status.phase}{"|"}{range .status.containerStatuses[*]}{.state.waiting.reason}{.state.terminated.reason}{end}{"\n"}{end}' 2>/dev/null || true)"
            if printf '%s\n' "$pod_status" | grep -Eq 'ImagePullBackOff|ErrImagePull|CrashLoopBackOff'; then
              echo "batch pod entered a terminal startup failure: $pod_status" >&2
              kubectl --context="$KUBE_CONTEXT" -n archebase-system describe pods -l job-name="$job" || true
              exit 1
            fi
            if (( $(date +%s) >= deadline )); then
              echo "batch Job exceeded the 3-hour deadline" >&2
              exit 1
            fi
            sleep 10
          done
        shell: bash

      - name: Cleanup batch resources
        if: always()
        run: |
          kubectl --context="$KUBE_CONTEXT" -n archebase-system delete job "hilbert-batch-migration-${GITHUB_RUN_ID}" --ignore-not-found=true
          kubectl --context="$KUBE_CONTEXT" -n archebase-system delete configmap "$MIGRATION_CONFIGMAP_NAME" --ignore-not-found=true
          kubectl --context="$KUBE_CONTEXT" -n archebase-system delete secret "$MIGRATION_SECRET_NAME" --ignore-not-found=true
        shell: bash


  validate:
    name: Create staging network preflight Job
    if: github.ref == 'refs/heads/chore/validate-staging-migration-network' && inputs.operation == 'network_probe'
    runs-on: archebase-ci-runner
    environment: staging
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    timeout-minutes: 15
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "validate-staging-network"
        shell: bash

      - name: Configure staging kubeconfig
        env:
          STAGING_NAMESPACE: ${{ inputs.namespace }}
          STAGING_SERVICE_ACCOUNT: ${{ inputs.serviceAccount }}
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$STAGING_KUBECONFIG_B64"
          path="${RUNNER_TEMP}/staging-kubeconfig"
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > "$path"
          chmod 600 "$path"
          export KUBECONFIG="$path"
          context="$(kubectl config current-context)"
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          echo "KUBE_CONTEXT=${context}"
          echo "KUBE_SERVER=${server}"
          kubectl --context="$context" auth whoami
          kubectl --context="$context" auth can-i create jobs.batch -n "$STAGING_NAMESPACE"
          kubectl --context="$context" auth can-i delete jobs.batch -n "$STAGING_NAMESPACE"
          kubectl --context="$context" config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
          kubectl --context="$context" get namespaces
          kubectl --context="$context" get namespace "$STAGING_NAMESPACE" -o name
          kubectl --context="$context" -n "$STAGING_NAMESPACE" get serviceaccount "$STAGING_SERVICE_ACCOUNT" -o name
          echo "KUBECONFIG=${KUBECONFIG}" >> "$GITHUB_ENV"
          echo "KUBE_CONTEXT=${context}" >> "$GITHUB_ENV"
        shell: bash

      - name: Refresh staging registry pull secret
        env:
          STAGING_NAMESPACE: ${{ inputs.namespace }}
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VOLCENGINE_CR_USERNAME"
          test -n "$VOLCENGINE_CR_PASSWORD"
          kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" create secret docker-registry keystone-staging-registry \
            --docker-server=archebase-cr-cn-beijing.cr.volces.com \
            --docker-username="$VOLCENGINE_CR_USERNAME" \
            --docker-password="$VOLCENGINE_CR_PASSWORD" \
            --dry-run=client -o yaml \
            | kubectl --context="$KUBE_CONTEXT" apply -f -
        shell: bash

      - name: Create and wait for validation Job
        env:
          STAGING_NAMESPACE: ${{ inputs.namespace }}
          STAGING_SERVICE_ACCOUNT: ${{ inputs.serviceAccount }}
          TOS_URL: ${{ inputs.tosUrl }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/staging-network-preflight.yaml" <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "$JOB_NAME"
            namespace: "$STAGING_NAMESPACE"
            labels:
              app.kubernetes.io/name: staging-network-preflight
              app.kubernetes.io/managed-by: keystone-ci
              archebase.io/environment: staging
          spec:
            ttlSecondsAfterFinished: 900
            backoffLimit: 0
            activeDeadlineSeconds: 120
            template:
              spec:
                serviceAccountName: "$STAGING_SERVICE_ACCOUNT"
                imagePullSecrets:
                  - name: keystone-staging-registry
                restartPolicy: Never
                containers:
                  - name: probe
                    image: "archebase-cr-cn-beijing.cr.volces.com/prod/keystone:4f0f0d20b219079b39044bca849b26d2f6aa9aa9"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        echo "identity: \$(id)"
                        echo "resolving: \$TOS_URL"
                        wget -S --spider --timeout=20 "\$TOS_URL" 2>&1 || status=\$?
                        if [ "\${status:-0}" -gt 8 ]; then
                          echo "TOS endpoint probe failed with wget exit code \$status" >&2
                          exit "\$status"
                        fi
                        echo "TOS endpoint probe completed; HTTP errors still prove network reachability"
                        echo "serviceAccount: \$STAGING_SERVICE_ACCOUNT"
                    env:
                      - name: TOS_URL
                        value: "$TOS_URL"
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
          YAML
          kubectl --context="$KUBE_CONTEXT" apply -f "${RUNNER_TEMP}/staging-network-preflight.yaml"
          if ! kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" wait --for=condition=complete "job/$JOB_NAME" --timeout=150s; then
            kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" get job "$JOB_NAME" -o yaml || true
            kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" get pods -l job-name="$JOB_NAME" -o wide || true
            kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" get events --sort-by=.lastTimestamp || true
            kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" logs "job/$JOB_NAME" --all-containers=true || true
            exit 1
          fi
          kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" logs "job/$JOB_NAME" --all-containers=true
        shell: bash

      - name: Cleanup validation Job
        if: always()
        env:
          STAGING_NAMESPACE: ${{ inputs.namespace }}
        run: kubectl --context="$KUBE_CONTEXT" -n "$STAGING_NAMESPACE" delete job "$JOB_NAME" --ignore-not-found=true
        shell: bash
