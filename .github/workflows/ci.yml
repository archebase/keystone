name: CI

on:
  push:
    branches: [ main, main-v2 ]
  pull_request:
    branches: [ main, main-v2 ]

jobs:
  # 1. gofmt check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l ./)" ]; then
            echo "The following files are not formatted:"
            gofmt -l ./
            exit 1
          fi

  # 2. REUSE license check
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fsfe-reuse
        run: |
          pip install reuse
          reuse --version

      - name: Check REUSE license compliance
        run: |
          reuse lint
          echo "✓ REUSE compliance check passed!"

      - name: Generate SPDX SBOM
        run: |
          reuse spdx --output reuse.spdx
          echo "✓ SPDX SBOM generated successfully!"

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom
          path: reuse.spdx
          retention-days: 90

  # 3. golangci-lint check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --timeout=5m

  # 4. unit tests + coverage
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs
      
      - name: Run tests with coverage
        run: go test -cover -race -v ./...

  swift:
    name: Swift SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Build Swift package
        run: swift build

      - name: Test Swift package
        run: swift test

      - name: Check generated Swift protobuf bindings
        run: |
          brew install protobuf
          sdk/swift/Scripts/bootstrap_swift_proto_toolchain.sh
          sdk/swift/Scripts/check_swift_proto_freshness.sh

  # 5. integration-test (scripts/test.sh)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs

      - name: Login to Volcengine CR
        env:
          VOLCENGINE_CR_ENDPOINT: archebase-cr-cn-beijing.cr.volces.com
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          test -n "$VOLCENGINE_CR_USERNAME" || (echo "VOLCENGINE_CR_USERNAME secret is required"; exit 1)
          test -n "$VOLCENGINE_CR_PASSWORD" || (echo "VOLCENGINE_CR_PASSWORD secret is required"; exit 1)
          echo "$VOLCENGINE_CR_PASSWORD" | docker login "$VOLCENGINE_CR_ENDPOINT" --username "$VOLCENGINE_CR_USERNAME" --password-stdin
      
      - name: Run integration tests
        run: bash scripts/test.sh
