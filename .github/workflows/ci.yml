name: CI

on:
  push:
    branches: [ main, main-v2 ]
  pull_request:
    branches: [ main, main-v2 ]

defaults:
  run:
    shell: bash

jobs:
  # 1. gofmt check
  fmt:
    name: Format Check
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'dev-acr-registry.cn-shanghai.cr.aliyuncs.com/third-party/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l ./)" ]; then
            echo "The following files are not formatted:"
            gofmt -l ./
            exit 1
          fi

  # 2. REUSE license check
  license:
    name: License Compliance
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'dev-acr-registry.cn-shanghai.cr.aliyuncs.com/third-party/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Install fsfe-reuse
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: |
          set -euo pipefail

          reuse_package="reuse[charset-normalizer]"
          export PATH="${HOME}/.local/bin:${PATH}"
          if ! command -v reuse > /dev/null 2>&1; then
            if python3 -m pip --version > /dev/null 2>&1; then
              python3 -m pip install --user "$reuse_package" || python3 -m pip install --user --break-system-packages "$reuse_package"
            elif python3 -m ensurepip --user > /dev/null 2>&1; then
              python3 -m pip install --user "$reuse_package" || python3 -m pip install --user --break-system-packages "$reuse_package"
            elif [ "$(id -u)" = "0" ] && command -v apt-get > /dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends file python3-pip
              python3 -m pip install --user "$reuse_package" || python3 -m pip install --user --break-system-packages "$reuse_package"
            elif command -v sudo > /dev/null 2>&1 && sudo -n true && command -v apt-get > /dev/null 2>&1; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends file python3-pip
              python3 -m pip install --user "$reuse_package" || python3 -m pip install --user --break-system-packages "$reuse_package"
            elif command -v pip > /dev/null 2>&1; then
              pip install --user "$reuse_package"
            else
              echo "python3 pip is required to install reuse" >&2
              exit 1
            fi
          fi

          reuse --version

      - name: Check REUSE license compliance
        run: |
          reuse lint
          echo "✓ REUSE compliance check passed!"

      - name: Generate SPDX SBOM
        run: |
          reuse spdx --output reuse.spdx
          echo "✓ SPDX SBOM generated successfully!"

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom
          path: reuse.spdx
          retention-days: 90

  # 3. golangci-lint check
  lint:
    name: Lint
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'dev-acr-registry.cn-shanghai.cr.aliyuncs.com/third-party/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --timeout=5m

  # 4. unit tests + coverage
  test:
    name: Unit Tests
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'dev-acr-registry.cn-shanghai.cr.aliyuncs.com/third-party/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs
      
      - name: Run tests with coverage
        run: go test -cover -race -v ./...

  # 5. integration-test (scripts/test.sh)
  integration-test:
    name: Integration Tests
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'dev-acr-registry.cn-shanghai.cr.aliyuncs.com/third-party/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g internal/server/server.go -o docs

      - name: Login to Volcengine CR
        env:
          VOLCENGINE_CR_ENDPOINT: archebase-cr-cn-beijing.cr.volces.com
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          test -n "$VOLCENGINE_CR_USERNAME" || (echo "VOLCENGINE_CR_USERNAME secret is required"; exit 1)
          test -n "$VOLCENGINE_CR_PASSWORD" || (echo "VOLCENGINE_CR_PASSWORD secret is required"; exit 1)
          echo "$VOLCENGINE_CR_PASSWORD" | docker login "$VOLCENGINE_CR_ENDPOINT" --username "$VOLCENGINE_CR_USERNAME" --password-stdin
      
      - name: Run integration tests
        run: bash scripts/test.sh
