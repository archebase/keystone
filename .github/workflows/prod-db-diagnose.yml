#
# Temporary operational helper: run read-only diagnostics against the
# production keystone MySQL through a one-off client pod, and publish the
# output into a ConfigMap that can be read with the read-only kubeconfig.

name: Prod DB diagnose

on:
  workflow_dispatch:
  push:
    branches: [ci/github-hosted-runners]
    paths: [.github/workflows/prod-db-diagnose.yml]

permissions:
  contents: read

env:
  DB_NAMESPACE: archebase-system
  REPORT_CONFIGMAP: prod-db-diag-report

jobs:
  diagnose:
    name: Stale upload task diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure production kubeconfig
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          test -n "$PROD_KUBECONFIG_B64"
          kubeconfig="${RUNNER_TEMP}/prod-kubeconfig"
          printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          kubectl config current-context
          kubectl -n "$DB_NAMESPACE" get pod mercury-mysql-0 -o wide

      - name: Run diagnostics through a one-off MySQL client pod
        run: |
          set -euo pipefail

          kubectl -n "$DB_NAMESPACE" delete pod db-diag --ignore-not-found --wait=false >/dev/null 2>&1 || true

          kubectl apply -f - <<'POD'
          apiVersion: v1
          kind: Pod
          metadata:
            name: db-diag
            namespace: archebase-system
            labels:
              app.kubernetes.io/name: keystone-db-diag
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 300
            imagePullSecrets:
              - name: keystone-production-registry
            containers:
              - name: mysql
                image: archebase-cr-cn-beijing.cr.volces.com/upstream/mysql:8.4.10
                env:
                  - name: MYSQL_PWD
                    valueFrom:
                      secretKeyRef:
                        name: mercury-credentials
                        key: mysql-password
                command: ["sh", "-c"]
                args:
                  - |
                    set -x
                    mysql --version
                    mysql -h mercury-mysql -P 3306 -u keystone keystone --table <<'SQL'
                    SELECT 'tasks status counts' AS section;
                    SELECT status, COUNT(*) AS n FROM tasks WHERE deleted_at IS NULL GROUP BY status ORDER BY n DESC;
                    SELECT 'tasks columns' AS section;
                    SHOW COLUMNS FROM tasks;
                    SELECT 'dc_plan columns' AS section;
                    SHOW COLUMNS FROM dc_plan;
                    SELECT 'stuck uploading tasks by plan' AS section;
                    SELECT t.dc_plan_id,
                           COUNT(*) AS stuck,
                           SUM(t.updated_at < NOW() - INTERVAL 2 HOUR)  AS older_2h,
                           SUM(t.updated_at < NOW() - INTERVAL 24 HOUR) AS older_24h,
                           SUM(t.metadata LIKE '%"auto_assigned_upload"%') AS marked_auto,
                           MIN(t.updated_at) AS oldest,
                           MAX(t.updated_at) AS newest
                    FROM tasks t
                    WHERE t.status = 'uploading' AND t.episode_id IS NULL AND t.deleted_at IS NULL
                    GROUP BY t.dc_plan_id
                    ORDER BY stuck DESC;
                    SELECT 'affected plans' AS section;
                    SELECT p.id, p.name, p.status, p.target_count, p.cur_count, p.updated_at
                    FROM dc_plan p
                    WHERE p.id IN (
                      SELECT DISTINCT dc_plan_id FROM tasks
                      WHERE status = 'uploading' AND episode_id IS NULL AND deleted_at IS NULL
                    )
                    ORDER BY p.id;
                    SELECT 'stuck task details (oldest 80)' AS section;
                    SELECT id, task_id, dc_plan_id, status, updated_at, episode_id,
                           LEFT(COALESCE(metadata, ''), 200) AS metadata
                    FROM tasks
                    WHERE status = 'uploading' AND episode_id IS NULL AND deleted_at IS NULL
                    ORDER BY updated_at ASC
                    LIMIT 80;
                    SQL
          POD

          echo "waiting for db-diag pod..."
          phase=""
          for _ in $(seq 1 90); do
            phase="$(kubectl -n "$DB_NAMESPACE" get pod db-diag -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          echo "pod phase: ${phase:-unknown}"

          kubectl -n "$DB_NAMESPACE" get pod db-diag -o wide || true
          report="$(kubectl -n "$DB_NAMESPACE" logs db-diag 2>&1 || true)"
          printf '%s\n' "$report"

          kubectl -n "$DB_NAMESPACE" create configmap "$REPORT_CONFIGMAP" \
            --from-literal=phase="${phase:-unknown}" \
            --from-literal=report="$report" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$DB_NAMESPACE" delete pod db-diag --ignore-not-found --wait=false >/dev/null 2>&1 || true
