#
# Temporary operational helper: inspect (and optionally clean) stale
# auto-assigned upload tasks in the production keystone database.
# Runs a one-off MySQL client pod and publishes the output to a ConfigMap
# that can be read with the read-only kubeconfig.

name: Prod DB diagnose

on:
  workflow_dispatch:
  push:
    branches: [ci/github-hosted-runners]
    paths: [.github/workflows/prod-db-diagnose.yml]

permissions:
  contents: read

env:
  DB_MODE: query            # query | cleanup
  RETAIN_HOURS: "24"
  DB_NAMESPACE: archebase-system
  REPORT_CONFIGMAP: prod-db-diag-report

jobs:
  diagnose:
    name: Stale upload task diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure production kubeconfig
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$PROD_KUBECONFIG_B64"
          kubeconfig="${RUNNER_TEMP}/prod-kubeconfig"
          printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          kubectl config current-context
          kubectl -n "$DB_NAMESPACE" get pod mercury-mysql-0 -o wide

      - name: Run diagnostics through a one-off MySQL client pod
        run: |
          set -euo pipefail

          kubectl -n "$DB_NAMESPACE" delete pod db-diag --ignore-not-found --wait=false >/dev/null 2>&1 || true

          mode_sql=""
          if [ "$DB_MODE" = "cleanup" ]; then
            mode_sql="
            SELECT 'release stale uploading tasks' AS section;
            UPDATE tasks
            SET status = 'failed',
                completed_at = COALESCE(completed_at, NOW()),
                error_message = 'manual cleanup: legacy stale auto-assigned upload',
                updated_at = NOW()
            WHERE status = 'uploading'
              AND episode_id IS NULL
              AND deleted_at IS NULL
              AND updated_at < NOW() - INTERVAL ${RETAIN_HOURS} HOUR;
            SELECT ROW_COUNT() AS released_rows;"
          fi

          kubectl apply -f - <<POD
          apiVersion: v1
          kind: Pod
          metadata:
            name: db-diag
            namespace: archebase-system
            labels:
              app.kubernetes.io/name: keystone-db-diag
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 600
            imagePullSecrets:
              - name: keystone-production-registry
            containers:
              - name: mysql
                image: archebase-cr-cn-beijing.cr.volces.com/upstream/mysql:8.4.10
                env:
                  - name: MYSQL_PWD
                    valueFrom:
                      secretKeyRef:
                        name: mercury-credentials
                        key: mysql-password
                command: ["sh", "-c"]
                args:
                  - |
                    set -x
                    mysql -h mercury-mysql -P 3306 -u keystone keystone --table <<'SQL'
                    SELECT 'overall stuck aggregate' AS section;
                    SELECT COUNT(DISTINCT dc_plan_id) AS plans,
                           COUNT(*) AS stuck,
                           SUM(updated_at < NOW() - INTERVAL ${RETAIN_HOURS} HOUR) AS older_retain,
                           SUM(metadata LIKE '%"auto_assigned_upload"%') AS marked_auto,
                           MIN(updated_at) AS oldest,
                           MAX(updated_at) AS newest
                    FROM tasks
                    WHERE status = 'uploading' AND episode_id IS NULL AND deleted_at IS NULL;
                    SELECT 'stuck tasks by month' AS section;
                    SELECT DATE_FORMAT(updated_at, '%Y-%m') AS ym, COUNT(*) AS n,
                           COUNT(DISTINCT dc_plan_id) AS plans
                    FROM tasks
                    WHERE status = 'uploading' AND episode_id IS NULL AND deleted_at IS NULL
                    GROUP BY ym ORDER BY ym;
                    SELECT 'stuck tasks by plan status' AS section;
                    SELECT p.status, COUNT(*) AS stuck, COUNT(DISTINCT t.dc_plan_id) AS plans
                    FROM tasks t JOIN dc_plan p ON p.id = t.dc_plan_id
                    WHERE t.status = 'uploading' AND t.episode_id IS NULL AND t.deleted_at IS NULL
                    GROUP BY p.status ORDER BY stuck DESC;
                    SELECT 'affected plans (top 60)' AS section;
                    SELECT p.id, p.status, p.target_count, p.cur_count,
                           (SELECT COUNT(*) FROM tasks t WHERE t.dc_plan_id = p.id AND t.status = 'uploading' AND t.episode_id IS NULL AND t.deleted_at IS NULL) AS stuck,
                           (SELECT COUNT(*) FROM tasks t WHERE t.dc_plan_id = p.id AND t.status = 'uploading' AND t.episode_id IS NULL AND t.deleted_at IS NULL AND t.updated_at < NOW() - INTERVAL ${RETAIN_HOURS} HOUR) AS stuck_retain,
                           (SELECT COUNT(*) FROM episodes e WHERE e.dc_plan_id = p.id AND e.deleted_at IS NULL) AS episodes
                    FROM dc_plan p
                    WHERE EXISTS (SELECT 1 FROM tasks t WHERE t.dc_plan_id = p.id AND t.status = 'uploading' AND t.episode_id IS NULL AND t.deleted_at IS NULL)
                    ORDER BY stuck DESC LIMIT 60;
                    ${mode_sql}
                    SELECT 'remaining stuck after run' AS section;
                    SELECT COUNT(*) AS stuck, COUNT(DISTINCT dc_plan_id) AS plans,
                           MIN(updated_at) AS oldest, MAX(updated_at) AS newest
                    FROM tasks
                    WHERE status = 'uploading' AND episode_id IS NULL AND deleted_at IS NULL;
                    SQL
          POD

          echo "waiting for db-diag pod..."
          phase=""
          for _ in $(seq 1 180); do
            phase="$(kubectl -n "$DB_NAMESPACE" get pod db-diag -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          echo "pod phase: ${phase:-unknown}"
          kubectl -n "$DB_NAMESPACE" get pod db-diag -o wide || true
          report="$(kubectl -n "$DB_NAMESPACE" logs db-diag 2>&1 || true)"
          printf '%s\n' "$report"

          kubectl -n "$DB_NAMESPACE" create configmap "$REPORT_CONFIGMAP" \
            --from-literal=mode="$DB_MODE" \
            --from-literal=phase="${phase:-unknown}" \
            --from-literal=report="$report" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$DB_NAMESPACE" delete pod db-diag --ignore-not-found --wait=false >/dev/null 2>&1 || true
