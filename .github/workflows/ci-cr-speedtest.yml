name: CR speed test

on:
  workflow_dispatch:
  push:
    branches: [ci/github-hosted-runners]
    paths: [.github/workflows/ci-cr-speedtest.yml]

permissions:
  contents: read
  packages: write

jobs:
  cluster-probe:
    name: Read-only probe of the staging cluster from a GitHub runner
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Configure staging kubeconfig
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$STAGING_KUBECONFIG_B64" || (echo "STAGING_KUBECONFIG_B64 is required" >&2; exit 1)
          kubeconfig_path="${RUNNER_TEMP}/staging-kubeconfig"
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > "$kubeconfig_path"
          chmod 600 "$kubeconfig_path"
          echo "KUBECONFIG=${kubeconfig_path}" >> "$GITHUB_ENV"

      - name: Probe cluster
        run: |
          set -uo pipefail
          echo "== client/server version =="
          kubectl version --client=true
          kubectl version -o json 2>/dev/null | jq -r '.serverVersion // "server unreachable" | if type=="object" then (.major + "." + .minor) else . end' || true
          echo "== current context =="
          kubectl config current-context || true
          echo "== admin? =="
          kubectl auth can-i '*' '*' --all-namespaces || true
          echo "== nodes =="
          kubectl get nodes -o wide || true
          echo "== storage classes =="
          kubectl get storageclass || true
          echo "== namespaces =="
          kubectl get ns --no-headers | head -20 || true
          echo "== timing a 5MiB configmap write (API throughput proxy) =="
          if kubectl get ns default >/dev/null 2>&1; then
            head -c 5242880 /dev/urandom | base64 -w0 > /tmp/payload.b64
            python3 - <<'PY' > /tmp/cm.json
          import json, pathlib
          payload = pathlib.Path('/tmp/payload.b64').read_text().strip()
          print(json.dumps({"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"ci-throughput-probe","namespace":"default"},"data":{"blob":payload}}))
          PY
            start=$(date +%s%N)
            kubectl create -f /tmp/cm.json >/dev/null 2>&1 || kubectl replace -f /tmp/cm.json >/dev/null 2>&1 || true
            end=$(date +%s%N)
            echo "kubectl create 5MiB configmap: $(( (end-start)/1000000 )) ms"
            kubectl delete configmap ci-throughput-probe -n default --ignore-not-found >/dev/null 2>&1 || true
          fi

  ghcr-push:
    name: GHCR push throughput
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Push a 20MiB image to GHCR
        run: |
          set -euo pipefail
          mkdir -p /tmp/pushctx
          head -c 20971520 /dev/urandom > /tmp/pushctx/blob
          printf 'FROM alpine:3.20\nCOPY blob /blob\n' > /tmp/pushctx/Dockerfile
          docker build -q -t ghcr.io/archebase/keystone:ci-speedtest /tmp/pushctx
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          start=$(date +%s%N)
          docker push ghcr.io/archebase/keystone:ci-speedtest
          end=$(date +%s%N)
          echo "ghcr push wall: $(( (end-start)/1000000 )) ms"
