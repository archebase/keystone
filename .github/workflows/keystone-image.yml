name: Keystone Image

on:
  push:
    branches: [main-v2]
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        required: true
        default: keystone
        type: choice
        options:
          - keystone
          - stereo-split
          - calibration
          - all

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VOLCENGINE_CR_ENDPOINT: archebase-cr-cn-beijing.cr.volces.com
  IMAGE_REPOSITORY: prod/keystone
  STEREO_SPLIT_IMAGE_REPOSITORY: prod/stereo-split
  CALIBRATION_IMAGE_REPOSITORY: prod/stereo-calibration
  ARCHEBASE_CALIB_REPOSITORY: git@gitlab.archebase.cn:robotics-and-ai/archebase_calib.git
  ARCHEBASE_CALIB_REF: refs/heads/main
  CALIBRATION_BUILD_JOBS: "2"
  BUILDKIT_NAMESPACE: buildkit
  BUILDKIT_IMAGE: ${{ vars.CI_BUILDKIT_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/buildkit:buildx-stable-1' }}
  BUILDKIT_PULL_SECRET: keystone-buildkit-registry-secret
  BUILDKIT_STORAGE: 40Gi
  BUILDKIT_CPU_REQUEST: "2"
  BUILDKIT_MEMORY_REQUEST: 2Gi
  BUILDKIT_CPU_LIMIT: "4"
  BUILDKIT_MEMORY_LIMIT: 4Gi
  BUILDKIT_PROGRESS: plain

jobs:
  build-and-push:
    name: Build and push selected images
    runs-on: archebase-ci-runner
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    if: github.ref == 'refs/heads/main-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select images to publish
        id: images
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          changed_files=()
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              mapfile -d '' -t changed_files \
                < <(git diff --name-only --no-renames -z "$BEFORE_SHA" "$GITHUB_SHA")
            else
              mapfile -d '' -t changed_files \
                < <(git show --format= --name-only --no-renames -z "$GITHUB_SHA")
            fi
          fi

          bash .github/scripts/select-images.sh \
            "$EVENT_NAME" \
            "$MANUAL_IMAGE" \
            "${changed_files[@]}"

      - name: Configure Docker config path
        run: |
          set -euo pipefail

          docker_config="${RUNNER_TEMP:-/tmp}/docker-config"
          mkdir -p "${docker_config}"
          printf 'DOCKER_CONFIG=%s\n' "${docker_config}" >> "${GITHUB_ENV}"

      - name: Validate build tooling and configuration
        run: |
          set -euo pipefail

          reject_docker_hub_ref() {
            local name="$1"
            local value="$2"
            local registry="${value%%/*}"

            if [[ -z "${value}" ]]; then
              echo "${name} must be set to a non-Docker-Hub image reference" >&2
              exit 1
            fi
            if [[ "${value}" != */* || "${value}" == docker.io/* || "${value}" == index.docker.io/* || "${value}" == registry-1.docker.io/* ]]; then
              echo "${name} must be a non-Docker-Hub image reference with an explicit registry: ${value}" >&2
              exit 1
            fi
            if [[ "${registry}" != *.* && "${registry}" != *:* && "${registry}" != "localhost" ]]; then
              echo "${name} looks like an implicit Docker Hub image reference: ${value}" >&2
              exit 1
            fi
          }

          command -v docker >/dev/null 2>&1 || (echo "docker client is required" >&2; exit 1)
          docker buildx version
          command -v kubectl >/dev/null 2>&1 || (echo "kubectl is required" >&2; exit 1)
          kubectl version --client=true
          reject_docker_hub_ref BUILDKIT_IMAGE "${BUILDKIT_IMAGE}"

      - name: Prepare BuildKit image pull secret
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$VOLCENGINE_CR_USERNAME" || (echo "VOLCENGINE_CR_USERNAME secret is required"; exit 1)
          test -n "$VOLCENGINE_CR_PASSWORD" || (echo "VOLCENGINE_CR_PASSWORD secret is required"; exit 1)
          test -n "$BUILDKIT_NAMESPACE" || (echo "BUILDKIT_NAMESPACE is required"; exit 1)
          test -n "$BUILDKIT_PULL_SECRET" || (echo "BUILDKIT_PULL_SECRET is required"; exit 1)

          kubectl -n "$BUILDKIT_NAMESPACE" get serviceaccount default >/dev/null
          kubectl -n "$BUILDKIT_NAMESPACE" create secret docker-registry "$BUILDKIT_PULL_SECRET" \
            --docker-server="$VOLCENGINE_CR_ENDPOINT" \
            --docker-username="$VOLCENGINE_CR_USERNAME" \
            --docker-password="$VOLCENGINE_CR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          existing_pull_secrets="$(kubectl -n "$BUILDKIT_NAMESPACE" get serviceaccount default -o jsonpath='{range .imagePullSecrets[*]}{.name}{"\n"}{end}')"
          if ! grep -Fxq "$BUILDKIT_PULL_SECRET" <<<"$existing_pull_secrets"; then
            if [[ -n "$existing_pull_secrets" ]]; then
              kubectl -n "$BUILDKIT_NAMESPACE" patch serviceaccount default \
                --type=json \
                -p="[{\"op\":\"add\",\"path\":\"/imagePullSecrets/-\",\"value\":{\"name\":\"$BUILDKIT_PULL_SECRET\"}}]"
            else
              kubectl -n "$BUILDKIT_NAMESPACE" patch serviceaccount default \
                --type=json \
                -p="[{\"op\":\"add\",\"path\":\"/imagePullSecrets\",\"value\":[{\"name\":\"$BUILDKIT_PULL_SECRET\"}]}]"
            fi
          fi

      - name: Configure registry auth
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$VOLCENGINE_CR_USERNAME" || (echo "VOLCENGINE_CR_USERNAME secret is required"; exit 1)
          test -n "$VOLCENGINE_CR_PASSWORD" || (echo "VOLCENGINE_CR_PASSWORD secret is required"; exit 1)
          docker_config="${DOCKER_CONFIG:?DOCKER_CONFIG must be configured before registry auth}"
          mkdir -p "$docker_config"
          auth="$(printf '%s:%s' "$VOLCENGINE_CR_USERNAME" "$VOLCENGINE_CR_PASSWORD" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$VOLCENGINE_CR_ENDPOINT" "$auth" > "$docker_config/config.json"

      - name: Set image metadata
        run: |
          echo "IMAGE=${VOLCENGINE_CR_ENDPOINT}/${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "STEREO_SPLIT_IMAGE=${VOLCENGINE_CR_ENDPOINT}/${STEREO_SPLIT_IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Kubernetes BuildKit builder
        id: buildkit
        run: |
          set -euo pipefail

          builder="keystone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          builder_resource="${builder}0"

          cleanup_kubernetes_builder_resources() {
            local ordinal
            docker buildx rm "$builder" >/dev/null 2>&1 || true
            kubectl -n "$BUILDKIT_NAMESPACE" delete statefulset,service "$builder_resource" \
              --ignore-not-found=true \
              --wait=false >/dev/null 2>&1 || true
            kubectl -n "$BUILDKIT_NAMESPACE" delete pvc \
              -l "archebase.dev/ci-buildkit-resource=$builder_resource" \
              --ignore-not-found=true \
              --wait=false >/dev/null 2>&1 || true
            for ((ordinal=0; ordinal<1; ordinal++)); do
              kubectl -n "$BUILDKIT_NAMESPACE" delete pvc "buildkit-state-$builder_resource-$ordinal" \
                --ignore-not-found=true \
                --wait=false >/dev/null 2>&1 || true
            done
          }

          create_kubernetes_builder_resources() {
            kubectl -n "$BUILDKIT_NAMESPACE" apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: $builder_resource
            labels:
              app.kubernetes.io/name: buildkit
              app.kubernetes.io/managed-by: keystone-ci
              archebase.dev/ci-buildkit-builder: "true"
              archebase.dev/ci-buildkit-resource: $builder_resource
          spec:
            ports:
              - name: buildkit
                port: 1234
                targetPort: buildkit
            selector:
              app.kubernetes.io/name: buildkit
              archebase.dev/ci-buildkit-resource: $builder_resource
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: $builder_resource
            labels:
              app.kubernetes.io/name: buildkit
              app.kubernetes.io/managed-by: keystone-ci
              archebase.dev/ci-buildkit-builder: "true"
              archebase.dev/ci-buildkit-resource: $builder_resource
          spec:
            serviceName: $builder_resource
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: buildkit
                archebase.dev/ci-buildkit-resource: $builder_resource
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: buildkit
                  app.kubernetes.io/managed-by: keystone-ci
                  archebase.dev/ci-buildkit-builder: "true"
                  archebase.dev/ci-buildkit-resource: $builder_resource
              spec:
                nodeSelector:
                  ci.archebase.io/arc-runner: "true"
                serviceAccountName: default
                containers:
                  - name: buildkitd
                    image: $BUILDKIT_IMAGE
                    imagePullPolicy: IfNotPresent
                    resources:
                      requests:
                        cpu: $BUILDKIT_CPU_REQUEST
                        memory: $BUILDKIT_MEMORY_REQUEST
                      limits:
                        cpu: $BUILDKIT_CPU_LIMIT
                        memory: $BUILDKIT_MEMORY_LIMIT
                    args:
                      - --addr=tcp://0.0.0.0:1234
                      - --allow-insecure-entitlement=network.host
                      - --allow-insecure-entitlement=security.insecure
                    ports:
                      - name: buildkit
                        containerPort: 1234
                    readinessProbe:
                      exec:
                        command:
                          - buildctl
                          - --addr
                          - tcp://127.0.0.1:1234
                          - debug
                          - workers
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                    securityContext:
                      privileged: true
                    volumeMounts:
                      - name: buildkit-state
                        mountPath: /var/lib/buildkit
            volumeClaimTemplates:
              - metadata:
                  name: buildkit-state
                  labels:
                    app.kubernetes.io/name: buildkit
                    app.kubernetes.io/managed-by: keystone-ci
                    archebase.dev/ci-buildkit-builder: "true"
                    archebase.dev/ci-buildkit-resource: $builder_resource
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: $BUILDKIT_STORAGE
          EOF
          }

          create_output=""
          create_kubernetes_builder() {
            local attempt endpoint
            endpoint="tcp://${builder_resource}.${BUILDKIT_NAMESPACE}.svc.cluster.local:1234"
            for attempt in 1 2 3; do
              if [[ "$attempt" -gt 1 ]]; then
                echo "::warning::retrying Kubernetes BuildKit builder creation for $builder ($attempt/3)"
                cleanup_kubernetes_builder_resources
                sleep 20
              fi
              if create_output="$(create_kubernetes_builder_resources 2>&1 \
                && kubectl -n "$BUILDKIT_NAMESPACE" rollout status "statefulset/$builder_resource" --timeout=5m 2>&1 \
                && docker buildx create --name "$builder" --driver remote "$endpoint" --use 2>&1 \
                && docker buildx inspect "$builder" --bootstrap 2>&1)"; then
                return 0
              fi
              echo "::warning::Kubernetes BuildKit builder creation failed for $builder ($attempt/3): $create_output"
            done
            cleanup_kubernetes_builder_resources
            return 1
          }

          if ! create_kubernetes_builder; then
            echo "failed to create Kubernetes BuildKit builder in namespace $BUILDKIT_NAMESPACE after 3 attempts: $create_output" >&2
            exit 1
          fi

          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build and push Keystone image
        if: steps.images.outputs.keystone == 'true'
        run: |
          docker buildx build \
            --builder "${{ steps.buildkit.outputs.builder }}" \
            --platform linux/amd64 \
            --build-arg VERSION="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --tag "$IMAGE" \
            --push \
            .

      - name: Inspect pushed Keystone image
        if: steps.images.outputs.keystone == 'true'
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Build and push stereo-split image
        if: steps.images.outputs.stereo_split == 'true'
        run: |
          docker buildx build \
            --builder "${{ steps.buildkit.outputs.builder }}" \
            --platform linux/amd64 \
            --file jobs/stereo-split/Dockerfile \
            --tag "$STEREO_SPLIT_IMAGE" \
            --push \
            .

      - name: Inspect pushed stereo-split image
        if: steps.images.outputs.stereo_split == 'true'
        run: docker buildx imagetools inspect "$STEREO_SPLIT_IMAGE"

      - name: Build and push calibration image
        id: calibration_image
        if: steps.images.outputs.calibration == 'true'
        env:
          ARCHEBASE_CALIB_SSH_PRIVATE_KEY: ${{ secrets.ARCHEBASE_CALIB_SSH_PRIVATE_KEY }}
          ARCHEBASE_GITLAB_KNOWN_HOSTS: ${{ secrets.ARCHEBASE_GITLAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for command_name in git jq mktemp ssh ssh-add ssh-agent tar; do
            command -v "$command_name" >/dev/null 2>&1 || \
              (echo "$command_name is required to build the calibration image" >&2; exit 1)
          done
          test -n "$ARCHEBASE_CALIB_SSH_PRIVATE_KEY" || \
            (echo "ARCHEBASE_CALIB_SSH_PRIVATE_KEY secret is required" >&2; exit 1)
          test -n "$ARCHEBASE_GITLAB_KNOWN_HOSTS" || \
            (echo "ARCHEBASE_GITLAB_KNOWN_HOSTS secret is required" >&2; exit 1)

          calibration_build_directory="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is required}/archebase-calib.XXXXXX")"
          ssh_directory="$calibration_build_directory/ssh"
          checkout_directory="$calibration_build_directory/checkout"
          context_directory="$calibration_build_directory/context"
          private_key="$ssh_directory/id_ed25519"
          known_hosts="$ssh_directory/known_hosts"
          install -d -m 0700 "$ssh_directory"
          printf '%s\n' "$ARCHEBASE_CALIB_SSH_PRIVATE_KEY" > "$private_key"
          printf '%s\n' "$ARCHEBASE_GITLAB_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"
          unset ARCHEBASE_CALIB_SSH_PRIVATE_KEY ARCHEBASE_GITLAB_KNOWN_HOSTS

          eval "$(ssh-agent -s)"
          cleanup_ssh() {
            ssh-agent -k >/dev/null 2>&1 || true
            rm -rf "$calibration_build_directory"
          }
          trap cleanup_ssh EXIT
          ssh-add "$private_key"

          install -d -m 0700 "$checkout_directory" "$context_directory"
          git -C "$checkout_directory" init --quiet
          git -C "$checkout_directory" remote add origin "$ARCHEBASE_CALIB_REPOSITORY"
          GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            git -C "$checkout_directory" fetch --quiet --depth=1 origin "$ARCHEBASE_CALIB_REF"
          revision="$(git -C "$checkout_directory" rev-parse --verify 'FETCH_HEAD^{commit}')"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve $ARCHEBASE_CALIB_REPOSITORY#$ARCHEBASE_CALIB_REF" >&2
            exit 1
          fi
          git -C "$checkout_directory" checkout --quiet --detach "$revision"
          GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            git -C "$checkout_directory" submodule update --init --recursive --depth=1
          tar --exclude='.git' --exclude='*/.git' -C "$checkout_directory" -cf - . \
            | tar -C "$context_directory" -xf -

          calibration_image="${VOLCENGINE_CR_ENDPOINT}/${CALIBRATION_IMAGE_REPOSITORY}:${GITHUB_SHA}-${revision:0:12}"
          metadata_file="${RUNNER_TEMP}/calibration-image-metadata.json"
          docker buildx build \
            --builder "${{ steps.buildkit.outputs.builder }}" \
            --platform linux/amd64 \
            --build-context "archebase_calib=$context_directory" \
            --build-arg "ARCHEBASE_CALIB_REVISION=$revision" \
            --build-arg "BUILD_JOBS=$CALIBRATION_BUILD_JOBS" \
            --file jobs/calibration/Dockerfile \
            --tag "$calibration_image" \
            --metadata-file "$metadata_file" \
            --push \
            .

          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Calibration image build did not return a valid digest" >&2
            exit 1
          fi
          image_ref="${VOLCENGINE_CR_ENDPOINT}/${CALIBRATION_IMAGE_REPOSITORY}@${digest}"
          echo "image=$calibration_image" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "archebase_calib_revision=$revision" >> "$GITHUB_OUTPUT"
          {
            echo "### Calibration image"
            echo
            echo "- Image: \`$calibration_image\`"
            echo "- Immutable ref: \`$image_ref\`"
            echo "- archebase_calib: \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect pushed calibration image
        if: steps.images.outputs.calibration == 'true'
        run: docker buildx imagetools inspect "${{ steps.calibration_image.outputs.image }}"

      - name: Remove temporary Kubernetes BuildKit builder
        if: always() && steps.buildkit.outputs.created == 'true'
        run: |
          set -euo pipefail

          builder="${{ steps.buildkit.outputs.builder }}"
          builder_resource="${builder}0"
          docker buildx rm "$builder" || true
          kubectl -n "$BUILDKIT_NAMESPACE" delete statefulset,service "$builder_resource" \
            --ignore-not-found=true \
            --wait=false || true
          kubectl -n "$BUILDKIT_NAMESPACE" delete pvc \
            -l "archebase.dev/ci-buildkit-resource=$builder_resource" \
            --ignore-not-found=true \
            --wait=false || true
          kubectl -n "$BUILDKIT_NAMESPACE" delete pvc "buildkit-state-$builder_resource-0" \
            --ignore-not-found=true \
            --wait=false || true
