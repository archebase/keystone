name: Deploy Keystone Stack

run-name: Deploy Keystone ${{ inputs.releaseName }}

on:
  workflow_dispatch:
    inputs:
      releaseName:
        description: "Helm release name. Derives keystone-<releaseName>.archebase.cn."
        required: true
        type: string
      keystoneImageTag:
        description: "Full Keystone commit SHA image tag. Empty uses the checked-out main-v2 HEAD."
        required: false
        default: ""
        type: string
      synapseImageTag:
        description: "Full Synapse commit SHA image tag."
        required: true
        default: "7cc5e77031ebc5146bf5cc7409334f97da8b867d"
        type: string
      dnsCnameReady:
        description: "Confirm keystone-<releaseName>.archebase.cn CNAME points to the production Keystone ALB."
        required: true
        default: false
        type: boolean
      confirmProduction:
        description: "Type deploy-production to confirm a production deployment."
        required: true
        type: string
      jobContainerImage:
        description: "Optional deploy job container image override."
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: keystone-stack-${{ inputs.releaseName }}
  cancel-in-progress: false

env:
  CHART_PATH: deploy/helm/keystone-stack
  PROD_NAMESPACE: archebase-system
  VOLCENGINE_CR_ENDPOINT: archebase-cr-cn-beijing.cr.volces.com
  KEYSTONE_IMAGE_REPOSITORY: prod/keystone
  SYNAPSE_IMAGE_REPOSITORY: prod/synapse
  KEYSTONE_PROD_ALB_DNS_NAME: alb-1pfcqpoqechs0845wfb1q8bq4.cn-beijing.volcenginealb.com

jobs:
  deploy:
    name: Deploy Keystone stack
    runs-on: archebase-ci-runner
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-v2'
    environment: production
    container:
      image: ${{ inputs.jobContainerImage || vars.CI_JOB_CONTAINER_IMAGE || 'archebase-cr-cn-beijing.cr.volces.com/upstream/actions-runner:2.334.0-dev-deploy-shell-e2e-dpctl-aliyun' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-v2

      - name: Verify deploy tooling
        run: |
          set -euo pipefail

          missing=()
          for tool in docker helm kubectl python3; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "deploy job container is missing required tools: ${missing[*]}" >&2
            echo "Set CI_JOB_CONTAINER_IMAGE or jobContainerImage to a deploy runner image that includes docker, helm, kubectl, and python3." >&2
            exit 1
          fi

          docker buildx version
          helm version --short
          kubectl version --client=true
          python3 --version

      - name: Resolve and validate deployment inputs
        id: inputs
        env:
          RELEASE_NAME: ${{ inputs.releaseName }}
          KEYSTONE_IMAGE_TAG_INPUT: ${{ inputs.keystoneImageTag }}
          SYNAPSE_IMAGE_TAG: ${{ inputs.synapseImageTag }}
          DNS_CNAME_READY: ${{ inputs.dnsCnameReady }}
          CONFIRM_PRODUCTION: ${{ inputs.confirmProduction }}
        run: |
          set -euo pipefail

          KEYSTONE_IMAGE_TAG="$KEYSTONE_IMAGE_TAG_INPUT"
          if [ -z "$KEYSTONE_IMAGE_TAG" ]; then
            KEYSTONE_IMAGE_TAG="$(git rev-parse HEAD)"
          fi

          if [ "$CONFIRM_PRODUCTION" != "deploy-production" ]; then
            echo "confirmProduction must be exactly deploy-production" >&2
            exit 1
          fi

          if [ "$DNS_CNAME_READY" != "true" ]; then
            echo "dnsCnameReady must be true before production deployment" >&2
            echo "Expected CNAME: keystone-${RELEASE_NAME}.archebase.cn -> ${KEYSTONE_PROD_ALB_DNS_NAME}" >&2
            exit 1
          fi

          if ! [[ "$RELEASE_NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "releaseName must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" >&2
            exit 1
          fi

          if [ "${#RELEASE_NAME}" -gt 53 ]; then
            echo "releaseName must have length of 1-53 characters" >&2
            exit 1
          fi

          if ! [[ "$KEYSTONE_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "keystoneImageTag must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

          if ! [[ "$SYNAPSE_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "synapseImageTag must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

          HOST="keystone-${RELEASE_NAME}.archebase.cn"
          KEYSTONE_IMAGE="${VOLCENGINE_CR_ENDPOINT}/${KEYSTONE_IMAGE_REPOSITORY}:${KEYSTONE_IMAGE_TAG}"
          SYNAPSE_IMAGE="${VOLCENGINE_CR_ENDPOINT}/${SYNAPSE_IMAGE_REPOSITORY}:${SYNAPSE_IMAGE_TAG}"

          {
            echo "release_name=${RELEASE_NAME}"
            echo "host=${HOST}"
            echo "keystone_image_tag=${KEYSTONE_IMAGE_TAG}"
            echo "synapse_image_tag=${SYNAPSE_IMAGE_TAG}"
            echo "keystone_image=${KEYSTONE_IMAGE}"
            echo "synapse_image=${SYNAPSE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
          KEYSTONE_HILBERT_ACCESS_KEY: ${{ secrets.KEYSTONE_HILBERT_ACCESS_KEY }}
          KEYSTONE_HILBERT_SECRET_KEY: ${{ secrets.KEYSTONE_HILBERT_SECRET_KEY }}
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$PROD_KUBECONFIG_B64" || (echo "PROD_KUBECONFIG_B64 secret is required" >&2; exit 1)
          test -n "$KEYSTONE_HILBERT_ACCESS_KEY" || (echo "KEYSTONE_HILBERT_ACCESS_KEY secret is required" >&2; exit 1)
          test -n "$KEYSTONE_HILBERT_SECRET_KEY" || (echo "KEYSTONE_HILBERT_SECRET_KEY secret is required" >&2; exit 1)
          test -n "$VOLCENGINE_CR_USERNAME" || (echo "VOLCENGINE_CR_USERNAME secret is required" >&2; exit 1)
          test -n "$VOLCENGINE_CR_PASSWORD" || (echo "VOLCENGINE_CR_PASSWORD secret is required" >&2; exit 1)

      - name: Check image availability in Volcengine CR
        env:
          VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
          KEYSTONE_IMAGE: ${{ steps.inputs.outputs.keystone_image }}
          SYNAPSE_IMAGE: ${{ steps.inputs.outputs.synapse_image }}
        run: |
          set -euo pipefail

          echo "$VOLCENGINE_CR_PASSWORD" | docker login "$VOLCENGINE_CR_ENDPOINT" --username "$VOLCENGINE_CR_USERNAME" --password-stdin
          docker buildx imagetools inspect "$KEYSTONE_IMAGE" > /dev/null
          docker buildx imagetools inspect "$SYNAPSE_IMAGE" > /dev/null

      - name: Configure production kubeconfig
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          KUBECONFIG_PATH="${RUNNER_TEMP}/prod-kubeconfig"
          if ! printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$KUBECONFIG_PATH"; then
            echo "PROD_KUBECONFIG_B64 must be a base64-encoded kubeconfig." >&2
            exit 1
          fi
          chmod 600 "$KUBECONFIG_PATH"
          export KUBECONFIG="$KUBECONFIG_PATH"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "$GITHUB_ENV"

          CURRENT_CONTEXT="$(kubectl config current-context)"
          if [ -z "$CURRENT_CONTEXT" ]; then
            echo "PROD_KUBECONFIG_B64 must decode to a kubeconfig with current-context set." >&2
            exit 1
          fi
          echo "Using Kubernetes context: ${CURRENT_CONTEXT}"
          kubectl auth whoami

          if ! kubectl auth can-i '*' '*' --all-namespaces --quiet; then
            echo "PROD_KUBECONFIG_B64 must grant production deployment permissions." >&2
            exit 1
          fi

      - name: Preflight production cluster resources
        run: |
          set -euo pipefail

          kubectl get namespace "$PROD_NAMESPACE" > /dev/null
          kubectl -n "$PROD_NAMESPACE" get serviceaccount keystone > /dev/null
          kubectl -n "$PROD_NAMESPACE" get secret keystone-production-registry > /dev/null
          kubectl get ingressclass keystone-prod > /dev/null

      - name: Render Helm chart
        env:
          RELEASE_NAME: ${{ steps.inputs.outputs.release_name }}
          KEYSTONE_IMAGE_TAG: ${{ steps.inputs.outputs.keystone_image_tag }}
          SYNAPSE_IMAGE_TAG: ${{ steps.inputs.outputs.synapse_image_tag }}
        run: |
          set -euo pipefail

          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$PROD_NAMESPACE" \
            --set-string keystone.image.tag="$KEYSTONE_IMAGE_TAG" \
            --set-string synapse.image.tag="$SYNAPSE_IMAGE_TAG" \
            --set-string credentials.hilbertAccessKey=placeholder \
            --set-string credentials.hilbertSecretKey=placeholder \
            > /dev/null

      - name: Deploy Helm release
        env:
          RELEASE_NAME: ${{ steps.inputs.outputs.release_name }}
          KEYSTONE_IMAGE_TAG: ${{ steps.inputs.outputs.keystone_image_tag }}
          SYNAPSE_IMAGE_TAG: ${{ steps.inputs.outputs.synapse_image_tag }}
          KEYSTONE_HILBERT_ACCESS_KEY: ${{ secrets.KEYSTONE_HILBERT_ACCESS_KEY }}
          KEYSTONE_HILBERT_SECRET_KEY: ${{ secrets.KEYSTONE_HILBERT_SECRET_KEY }}
        run: |
          set -euo pipefail

          SECRET_VALUES_FILE="$(mktemp)"
          cleanup() {
            rm -f "$SECRET_VALUES_FILE"
          }
          trap cleanup EXIT

          python3 - <<'PY' > "$SECRET_VALUES_FILE"
          import json
          import os

          print(json.dumps({
              "credentials": {
                  "hilbertAccessKey": os.environ["KEYSTONE_HILBERT_ACCESS_KEY"],
                  "hilbertSecretKey": os.environ["KEYSTONE_HILBERT_SECRET_KEY"],
              }
          }))
          PY

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$PROD_NAMESPACE" \
            --atomic \
            --wait \
            --timeout 15m \
            --history-max 20 \
            --values "$SECRET_VALUES_FILE" \
            --set-string keystone.image.tag="$KEYSTONE_IMAGE_TAG" \
            --set-string synapse.image.tag="$SYNAPSE_IMAGE_TAG"

      - name: Report release endpoints
        env:
          RELEASE_NAME: ${{ steps.inputs.outputs.release_name }}
          HOST: ${{ steps.inputs.outputs.host }}
          KEYSTONE_IMAGE: ${{ steps.inputs.outputs.keystone_image }}
          SYNAPSE_IMAGE: ${{ steps.inputs.outputs.synapse_image }}
        run: |
          set -euo pipefail

          helm status "$RELEASE_NAME" --namespace "$PROD_NAMESPACE"

          {
            echo "### Keystone production release"
            echo
            echo "- Release: \`${RELEASE_NAME}\`"
            echo "- Namespace: \`${PROD_NAMESPACE}\`"
            echo "- HTTP/WebSocket/API: \`https://${HOST}\`"
            echo "- gRPC: \`${HOST}:50053\`"
            echo "- Keystone image: \`${KEYSTONE_IMAGE}\`"
            echo "- Synapse image: \`${SYNAPSE_IMAGE}\`"
            echo
            echo "Admin password lookup:"
            echo
            echo "\`\`\`bash"
            echo "kubectl -n ${PROD_NAMESPACE} get secret ${RELEASE_NAME}-credentials -o jsonpath='{.data.admin-password}' | base64 -d; echo"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
